[project]
name = "document-extract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "afrontcode", email = "slandrea00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.23.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
]

[project.scripts]
document-extract = "document_extract:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
